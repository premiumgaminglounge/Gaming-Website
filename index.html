<!-- ROLLSWEEPS POSTER + LIVE CHAT FIX -->
<script>
(function () {

  // 1. SHOW THE ORIGINAL POSTER ON WEBSITE
  const poster = document.querySelector(".top-dp");

  if (poster) {
    poster.src = "./rollsweeps-facebook-preview-v2.jpg";
    poster.alt = "RollSweeps Official Poster";
    poster.style.objectFit = "contain";
    poster.style.objectPosition = "center";
    poster.style.background = "#071626";
  }

  // 2. FIX ALL LIVE CHAT BUTTONS
  window.openLiveChat = function () {
    let attempts = 0;

    function openChat() {
      if (
        window.chaport &&
        typeof window.chaport.q === "function"
      ) {
        try {
          window.chaport.q("open");
          return;
        } catch (error) {
          console.error("Chaport error:", error);
        }
      }

      attempts++;

      if (attempts < 30) {
        setTimeout(openChat, 500);
      } else {
        alert(
          "Live Chat is temporarily unavailable. Please try again."
        );
      }
    }

    openChat();
  };

  // 3. KEEP FACEBOOK POSTER PREVIEW
  const posterURL =
    "https://premiumgaminglounge.github.io/Gaming-Website/rollsweeps-facebook-preview-v2.jpg";

  document.querySelectorAll(
    'meta[property="og:image"], meta[property="og:image:secure_url"]'
  ).forEach(function (meta) {
    meta.content = posterURL;
  });

  const twitterImage = document.querySelector(
    'meta[name="twitter:image"]'
  );

  if (twitterImage) {
    twitterImage.content = posterURL;
  }

})();
</script>
<!-- END ROLLSWEEPS FIX -->
</body>
</html>
